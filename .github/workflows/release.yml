name: Release APK

# Push a version tag (e.g. v0.1.18) to build the release APK and publish it as
# a GitHub Release automatically.
#
#   git tag v0.1.18 && git push origin v0.1.18
#
# Release signing is optional: if the CCM_ANDROID_* repository secrets are set,
# the APK is signed with them; otherwise android/app/build.gradle falls back to
# debug signing so the APK stays installable.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          # Optional signing — populated from repo secrets when present, empty
          # otherwise (build.gradle then falls back to debug signing).
          CCM_ANDROID_STORE_FILE: ${{ secrets.CCM_ANDROID_STORE_FILE }}
          CCM_ANDROID_STORE_PASSWORD: ${{ secrets.CCM_ANDROID_STORE_PASSWORD }}
          CCM_ANDROID_KEY_ALIAS: ${{ secrets.CCM_ANDROID_KEY_ALIAS }}
          CCM_ANDROID_KEY_PASSWORD: ${{ secrets.CCM_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: build/app/outputs/flutter-apk/app-release.apk
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
