name: Release APK

# Push a version tag (e.g. v0.1.18) to build the release APK and publish it as
# a GitHub Release automatically.
#
#   git tag v0.1.18 && git push origin v0.1.18
#
# Release signing is optional: if the CCM_ANDROID_* repository secrets are set,
# the APK is signed with them; otherwise android/app/build.gradle falls back to
# debug signing so the APK stays installable.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.CCM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          # A stable release keystore keeps the APK signature constant across
          # releases, so updates install over the previous build without an
          # uninstall. Without it, the build falls back to a per-runner debug
          # key (signature changes every release).
          if [ -n "$KEYSTORE_BASE64" ]; then
            dest="$RUNNER_TEMP/ccm-release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$dest"
            echo "CCM_ANDROID_STORE_FILE=$dest" >> "$GITHUB_ENV"
            echo "Release keystore decoded; signing with the stable release key."
          else
            echo "No CCM_ANDROID_KEYSTORE_BASE64 secret; falling back to debug signing."
          fi

      - name: Build release APK
        env:
          # Signing — CCM_ANDROID_STORE_FILE is exported by the decode step above
          # when the keystore secret is present; otherwise build.gradle falls
          # back to debug signing.
          CCM_ANDROID_STORE_PASSWORD: ${{ secrets.CCM_ANDROID_STORE_PASSWORD }}
          CCM_ANDROID_KEY_ALIAS: ${{ secrets.CCM_ANDROID_KEY_ALIAS }}
          CCM_ANDROID_KEY_PASSWORD: ${{ secrets.CCM_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Split-per-ABI keeps each download small (~20MB vs ~52MB universal).
          # Attach each arch under a versioned name, e.g. ccm-v0.1.36-arm64-v8a.apk
          OUT=build/app/outputs/flutter-apk
          ARTIFACTS=()
          for arch in arm64-v8a armeabi-v7a x86_64; do
            src="$OUT/app-${arch}-release.apk"
            dst="ccm-${TAG}-${arch}.apk"
            cp "$src" "$dst"
            ARTIFACTS+=("$dst")
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ARTIFACTS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ARTIFACTS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
